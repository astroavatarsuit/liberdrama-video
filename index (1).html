<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liberdrama</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }
    .video-wrap {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      background: #000;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="video-wrap">
    <video controls playsinline preload="metadata">
      <source src="liberdrama.mp4" type="video/mp4">
      Tu navegador no puede reproducir este video.
    </video>
  </div>
</body>
</html>
